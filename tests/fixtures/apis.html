<!doctype html><html><head><meta charset="utf-8"><title>API test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><h1 id="h">waiting</h1><p id="out"></p>
<script>
var r = [];
try { var ac = new AbortController(); ac.abort(); r.push('abort:' + ac.signal.aborted); } catch(e) { r.push('abort-ERR'); }
try { r.push('uuid:' + (crypto.randomUUID().length)); } catch(e) { r.push('uuid-ERR'); }
try { var u = new URL('/a/b?x=1&y=two', 'https://example.org/start'); r.push('url:' + u.hostname + u.pathname + ':' + u.searchParams.get('y')); } catch(e) { r.push('url-ERR ' + e); }
try { r.push('enc:' + new TextEncoder().encode('é').length); } catch(e) { r.push('enc-ERR'); }
try { r.push('b64:' + btoa('hi') + '/' + atob('aGk=')); } catch(e) { r.push('b64-ERR'); }
try { r.push('perf:' + (typeof performance.now())); } catch(e) { r.push('perf-ERR'); }
try { var mo = new MutationObserver(function(){}); mo.observe(document.body, {}); r.push('mo:ok'); } catch(e) { r.push('mo-ERR'); }
window.addEventListener('load', function () { document.getElementById('out').textContent = 'load fired: ' + r.join(' | '); });
document.getElementById('h').textContent = 'ran';
</script></body></html>
