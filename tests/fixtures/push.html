<!doctype html><html><head><meta charset="utf-8"><title>History test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><p id="out">waiting</p>
<script>
window.addEventListener('popstate', function (e) {
  document.getElementById('out').textContent = 'popstate step ' + (e.state ? e.state.step : 'none');
});
// Push once: a page that pushed on every load would push again when Back brings it back.
if (!localStorage.getItem('pushed')) {
  localStorage.setItem('pushed', '1');
  history.pushState({ step: 1 }, '', '/push/one');
  history.pushState({ step: 2 }, '', '/push/two');
}
document.getElementById('out').textContent = 'path:' + location.pathname + ' state:' + (history.state ? history.state.step : 'none');
</script></body></html>
