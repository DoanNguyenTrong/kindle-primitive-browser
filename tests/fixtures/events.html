<!doctype html><html><head><meta charset="utf-8"><title>Events test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:160px 30px}input{font-size:36px;padding:10px}button{font-size:40px;padding:14px 36px;margin-top:20px}</style></head>
<body><form id="f" action="/search" method="get">
<input type="text" name="q" id="q" value="">
<br><button type="submit">Send</button></form>
<p id="out">waiting</p>
<script>
var counts = { input: 0, change: 0, submit: 0 };
var q = document.getElementById('q');
q.addEventListener('input', function () { counts.input++; });
q.addEventListener('change', function () {
  counts.change++;
  document.getElementById('out').textContent = 'input:' + counts.input + ' change:' + counts.change;
});
document.getElementById('f').addEventListener('submit', function (e) {
  counts.submit++;
  e.preventDefault();
  document.getElementById('out').textContent = 'submit blocked:' + counts.submit;
});
</script></body></html>
