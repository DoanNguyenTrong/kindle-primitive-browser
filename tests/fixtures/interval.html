<!doctype html><html><head><meta charset="utf-8"><title>Interval test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><p id="out">waiting</p>
<script>
var ticks = 0;
var id = setInterval(function () {
  ticks++;
  document.getElementById('out').textContent = 'ticks:' + ticks;
}, 1000);
var stopped = setInterval(function () { document.getElementById('out').textContent = 'stopped ran'; }, 1000);
clearInterval(stopped);
</script></body></html>
