<!doctype html><html><head><meta charset="utf-8"><title>Web APIs test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><h1>Web APIs</h1><p id="out">waiting</p>
<script>
var out = [];
out.push('media:' + [matchMedia('print').matches, matchMedia('not print').matches,
  matchMedia('(min-width: 1px) and (max-width: 99999px)').matches, matchMedia('(hover: none)').matches,
  matchMedia('(max-width: 1px), (min-width: 1px)').matches].join(','));
var x = new XMLHttpRequest();
x.open('GET', '/plain.html');
x.onload = function () {
  out.push('xhr:' + x.status + ':' + (x.responseText.length > 0) + ':' + x.readyState);
  document.getElementById('out').textContent = out.join(' | ');
};
x.onerror = function () { out.push('xhr-error'); document.getElementById('out').textContent = out.join(' | '); };
x.send();
</script></body></html>
