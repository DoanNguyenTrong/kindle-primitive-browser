<!doctype html><html><head><meta charset="utf-8"><title>Storage test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><p id="out">waiting</p>
<script>
var before = localStorage.getItem('visits') || '0';
localStorage.setItem('visits', String(Number(before) + 1));
document.getElementById('out').textContent = 'visits:' + localStorage.getItem('visits') + ' keys:' + localStorage.length;
</script></body></html>
