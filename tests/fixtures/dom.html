<!doctype html><html><head><meta charset="utf-8"><title>DOM test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:150px 30px}</style></head>
<body><div id="box" class="a b"><span class="item">one</span><span class="item">two</span></div>
<p id="res"></p>
<script>
var r = [];
var box = document.getElementById('box');
r.push('byClass:' + box.getElementsByClassName('item').length);
r.push('cl:' + box.classList.contains('a'));
box.classList.add('c'); r.push('add:' + box.className);
box.classList.toggle('a'); r.push('tog:' + box.className);
box.dataset.role = 'main'; r.push('data:' + box.getAttribute('data-role'));
r.push('match:' + box.matches('div.b'));
var s = box.querySelector('.item');
r.push('closest:' + s.closest('#box').id);
r.push('sib:' + s.nextElementSibling.textContent);
box.insertAdjacentHTML('beforeend', '<em>ins</em>');
r.push('ins:' + box.lastElementChild.tagName);
r.push('names:' + document.getElementsByName('x').length);
document.getElementById('res').textContent = r.join(' | ');
</script></body></html>
