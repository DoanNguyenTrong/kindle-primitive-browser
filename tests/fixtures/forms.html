<!doctype html><html><head><meta charset="utf-8"><title>Forms test</title>
<style>body{font-family:sans-serif;font-size:34px;padding:160px 30px 30px}
input,textarea{font-size:36px;padding:10px;border:3px solid #000;border-radius:8px;margin:6px 0}
input[type=checkbox],input[type=radio]{width:40px;height:40px}
button{font-size:40px;padding:16px 40px;margin-top:30px}</style></head>
<body><form action="/search" method="get">
<label><input type="checkbox" name="agree" value="yes" checked> I agree</label><br>
<label><input type="checkbox" name="news" value="on"> Send news</label><br>
<label><input type="radio" name="size" value="s"> Small</label>
<label><input type="radio" name="size" value="m" checked> Medium</label>
<label><input type="radio" name="size" value="l"> Large</label><br>
<label>Password <input type="password" name="pw" value=""></label><br>
<label>Locked <input type="text" name="rd" value="y" readonly></label><br>
<label>Disabled <input type="text" name="dis" value="x" disabled></label><br>
<button type="submit">Send</button></form></body></html>
