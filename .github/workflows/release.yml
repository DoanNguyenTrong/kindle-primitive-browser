name: Release

# Runs when a version tag such as v0.1.17 is pushed. See docs/VERSIONING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The tag must match Cargo.toml
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(python3 -c "import re; print(re.search(r'^version = \"([0-9]+\.[0-9]+\.[0-9]+)\"', open('Cargo.toml').read(), re.M).group(1))")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2

      - name: Install zig, cargo-zigbuild and zip
        run: |
          sudo apt-get install -y zip
          python3 -m pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Test, build the device binary and package
        run: |
          cargo test --workspace
          cargo zigbuild --release -p kb-kindle --target armv7-unknown-linux-musleabihf
          sh scripts/package-release.sh

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
