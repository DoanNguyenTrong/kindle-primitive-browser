name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and launcher checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace
      - name: Launcher checks (stub commands)
        run: sh scripts/launcher-stub-test.sh

  desktop:
    name: Desktop regression with screenshots
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the desktop driver
        run: cargo build --release -p kb-desktop
      - name: Regression (67 scenarios)
        env:
          KB_ARTIFACTS: ${{ runner.temp }}/artifacts
        run: sh scripts/desktop-regression.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: ${{ runner.temp }}/artifacts

  device-build:
    name: ARM device build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,armv7-unknown-linux-musleabi
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        run: |
          sudo apt-get install -y zip
          python3 -m pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build the device binary
        run: cargo zigbuild --release -p kb-kindle --target armv7-unknown-linux-musleabihf
      - name: Check it is an ARM binary
        run: file target/armv7-unknown-linux-musleabihf/release/kb-kindle | grep -q ARM
      - name: Build the soft-float device binary
        run: cargo zigbuild --locked --release -p kb-kindle --target armv7-unknown-linux-musleabi
      - name: Package (dry run)
        run: sh scripts/package-release.sh
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: primitive-browser-package
          path: dist/
